<title>Analista de datos · Power BI + Tableau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Curso interactivo de Power BI Desktop y Tableau Public para el perfil de analista de datos junior, alineado con la certificación PL-300. Dr. Bits.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra de fórmulas como cabecera + hoja de estudio en una columna de lectura,
   con rejilla de celdas (letras de columna / números de fila) como motivo del tema. */
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --surface-2:#EBEFF8; --line:#D6DCEA; --grid:#E4E8F2;
  --ink:#11153A; --muted:#566080; --brand:#00006A; --brand-ink:#00006A; --cyan:#45E7FF;
  --cyan-soft:#D9F9FF; --on-brand:#FFFFFF; --sel:#E2FAFF; --on-strong:#FFFFFF;
  --good:#15784A; --good-soft:#E3F4EB; --warn:#8E5A00; --warn-soft:#FBF0DA; --bad:#B42318; --bad-soft:#FBE7E5;
  --s1:#4A5AD8; --s2:#0E9BB8; --s3:#D0336F; --s0:#9AA3BF;
  --f-display:"Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  --r:10px; --shadow:0 1px 2px rgba(10,14,60,.06), 0 6px 18px rgba(10,14,60,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A0D26; --surface:#121641; --surface-2:#1A1F52; --line:#2B3274; --grid:#232966;
  --ink:#E9ECFA; --muted:#A5ADD3; --brand:#2C34B8; --brand-ink:#A9B4FF; --cyan:#45E7FF;
  --cyan-soft:#123A4E; --on-brand:#FFFFFF; --sel:#12324A; --on-strong:#0A0D26;
  --good:#5CCB95; --good-soft:#123628; --warn:#E8B657; --warn-soft:#3A2E12; --bad:#FF8A80; --bad-soft:#3E1A1F;
  --s1:#9478F0; --s2:#14A6BF; --s3:#E35683; --s0:#5D658F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A0D26; --surface:#121641; --surface-2:#1A1F52; --line:#2B3274; --grid:#232966;
  --ink:#E9ECFA; --muted:#A5ADD3; --brand:#2C34B8; --brand-ink:#A9B4FF; --cyan:#45E7FF;
  --cyan-soft:#123A4E; --on-brand:#FFFFFF; --sel:#12324A; --on-strong:#0A0D26;
  --good:#5CCB95; --good-soft:#123628; --warn:#E8B657; --warn-soft:#3A2E12; --bad:#FF8A80; --bad-soft:#3E1A1F;
  --s1:#9478F0; --s2:#14A6BF; --s3:#E35683; --s0:#5D658F;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{transition:none!important}}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.55; margin:0}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display); line-height:1.2; text-wrap:balance; margin:0; color:var(--ink)}
h1{font-size:clamp(1.9rem,4.2vw,2.8rem); font-weight:600; letter-spacing:-.02em}
h2{font-size:clamp(1.35rem,2.6vw,1.7rem); font-weight:600; letter-spacing:-.01em}
h3{font-size:1.12rem; font-weight:600}
h4{font-size:1rem; font-weight:600}
p{margin:0}
a{color:var(--brand-ink)}
code,.mono{font-family:var(--f-mono); font-size:.86em}
p code, li code, span code, .callout code, .qitem, .opt, .why, .prompt pre, td{overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--cyan); outline-offset:2px; border-radius:4px}
.wrap{max-width:1120px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.read{max-width:760px}
.eyebrow{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.mlayout > *, .hero > *, .tramo > *, .two > *, .prose > *, .stack > *, .grid2 > *, .grid3 > *{min-width:0; max-width:100%}

/* ---------- Cabecera ---------- */
header.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; gap:14px; padding-block:10px; flex-wrap:wrap}
.logo{background:#FFFFFF; border-radius:8px; padding:4px 8px; display:flex; align-items:center; border:1px solid var(--line)}
.logo img{height:30px; width:auto; display:block}
.brandtxt{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.brandtxt b{font-family:var(--f-display); font-weight:600; font-size:1rem}
.brandtxt span{font-size:.8rem; color:var(--muted)}
nav.main{display:flex; gap:2px; margin-left:auto; flex-wrap:wrap}
nav.main a{font-family:var(--f-display); font-size:.88rem; text-decoration:none; color:var(--muted); padding:7px 10px; border-radius:8px}
nav.main a:hover{background:var(--surface-2); color:var(--ink)}
nav.main a[aria-current="page"]{background:var(--brand); color:var(--on-brand)}
.tools{display:flex; align-items:center; gap:10px}
.progress-pill{display:flex; align-items:center; gap:8px; font-size:.82rem; color:var(--muted)}
.meter{width:70px; height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line)}
.meter i{display:block; height:100%; background:var(--cyan); width:0}
.toggle{font-family:var(--f-display); font-size:.78rem; border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:5px 9px; border-radius:99px; cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--warn-soft); border-color:var(--warn); color:var(--ink)}

/* ---------- Barra de fórmulas ---------- */
.fx{display:flex; align-items:stretch; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); font-family:var(--f-mono); font-size:.92rem; max-width:100%}
.fx .namebox{padding:8px 12px; border-right:1px solid var(--line); color:var(--muted); min-width:64px; background:var(--surface-2)}
.fx .fxl{padding:8px 10px; border-right:1px solid var(--line); color:var(--muted); font-style:italic}
.fx .formula{padding:8px 12px; overflow-x:auto; white-space:nowrap; color:var(--ink); min-width:0; flex:1}
.fx .fn{color:var(--brand-ink); font-weight:600}
.fx .str{color:var(--good)}

/* ---------- Hero e inicio ---------- */
.hero{padding-block:44px 28px; display:grid; grid-template-columns:1.25fr .9fr; gap:36px; align-items:start}
.hero .lead{font-size:1.15rem; color:var(--muted); max-width:60ch}
.stats{display:grid; gap:10px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; align-items:baseline}
.stat b{font-family:var(--f-display); font-size:1.9rem; font-weight:600; color:var(--brand-ink); font-variant-numeric:tabular-nums; grid-row:span 2}
.stat span{font-size:.95rem}
.stat small{font-size:.78rem; color:var(--muted)}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.path{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px}
@media (max-width:860px){.path{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.path{grid-template-columns:1fr}}
.path a{display:flex; flex-direction:column; gap:6px; padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); text-decoration:none; color:inherit}
.path a:hover{border-color:var(--brand-ink); box-shadow:var(--shadow)}
.path a b{font-family:var(--f-display); font-weight:600}
.path a span{font-size:.9rem; color:var(--muted)}
.path a .n{font-family:var(--f-mono); font-size:.75rem; color:var(--muted)}

.btn{font-family:var(--f-display); font-size:.92rem; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 14px; border-radius:8px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px}
.btn:hover{border-color:var(--brand-ink)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.small{font-size:.82rem; padding:6px 10px}
.btn[aria-pressed="true"]{background:var(--cyan-soft); border-color:var(--cyan); color:var(--ink)}

section.block{padding-block:28px; border-top:1px solid var(--line)}
.sechead{display:flex; flex-direction:column; gap:6px; margin-bottom:18px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px}
@media (max-width:860px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- Diagnóstico ---------- */
.diag{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (max-width:760px){.diag{grid-template-columns:1fr}}
.q{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:10px}
.q p{font-size:.98rem}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; align-self:flex-start}
.seg button{font:inherit; font-size:.85rem; padding:5px 14px; border:0; background:var(--surface); color:var(--ink); cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--brand); color:var(--on-brand)}
.result{margin-top:16px; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--cyan); border-radius:var(--r); padding:16px 18px}

/* ---------- Ruta ---------- */
.tramo{display:grid; grid-template-columns:220px 1fr; gap:20px; padding-block:18px; border-top:1px dashed var(--line)}
.tramo:first-of-type{border-top:0}
@media (max-width:760px){.tramo{grid-template-columns:1fr}}
.cards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
@media (max-width:640px){.cards{grid-template-columns:1fr}}
.kcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; text-decoration:none; color:inherit}
.kcard:hover{border-color:var(--brand-ink); box-shadow:var(--shadow)}
.kcard > *{min-width:0}
.kcard .cell{grid-row:span 3; font-family:var(--f-mono); font-size:.8rem; width:46px; height:46px; display:grid; place-items:center; border:1px solid var(--line); background:var(--surface-2); border-radius:6px; color:var(--muted)}
.kcard.on .cell{background:var(--brand); color:var(--on-brand); border-color:var(--brand)}
.kcard h3{font-size:1rem}
.kcard p{font-size:.9rem; color:var(--muted)}
.tags{display:flex; gap:6px; flex-wrap:wrap}
.tag{font-size:.72rem; font-family:var(--f-mono); padding:2px 7px; border-radius:99px; border:1px solid var(--line); color:var(--muted); background:var(--surface)}
.tag.ok{border-color:var(--good); color:var(--good); background:var(--good-soft)}
.tag.av{border-color:var(--cyan); color:var(--ink); background:var(--cyan-soft)}
.tag.new{border-color:var(--warn); color:var(--warn); background:var(--warn-soft)}

/* ---------- Módulo ---------- */
.mhead{padding-block:32px 22px; display:flex; flex-direction:column; gap:14px}
.mlayout{display:grid; grid-template-columns:200px minmax(0,1fr); gap:32px; align-items:start; padding-bottom:40px}
@media (max-width:900px){.mlayout{grid-template-columns:1fr} nav.toc{display:none}}
.toc{position:sticky; top:calc(env(safe-area-inset-top,0px) + 80px); display:flex; flex-direction:column; gap:2px; font-size:.88rem}
.toc a{text-decoration:none; color:var(--muted); padding:6px 10px; border-left:2px solid var(--line); display:flex; gap:8px}
.toc a:hover{color:var(--ink); border-left-color:var(--cyan)}
.toc a span{font-family:var(--f-mono); font-size:.75rem; padding-top:2px}
.step{padding-block:22px; border-top:1px solid var(--line); scroll-margin-top:90px}
.step:first-child{border-top:0; padding-top:0}
.step > .sh{display:flex; align-items:baseline; gap:12px; margin-bottom:12px}
.step > .sh .n{font-family:var(--f-mono); font-size:.8rem; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:1px 7px}
.prose{display:flex; flex-direction:column; gap:12px; max-width:70ch}
.prose ul,.prose ol{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:6px}
ul.plain{margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:6px}
.callout{border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; background:var(--surface); display:flex; flex-direction:column; gap:6px}
.callout.gap{border-left:4px solid var(--bad)}
.callout.tip{border-left:4px solid var(--cyan)}
.callout.warn{border-left:4px solid var(--warn)}
.callout.good{border-left:4px solid var(--good)}
.callout .k{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; min-width:0}
.panel.bad{border-top:3px solid var(--bad)}
.panel.good{border-top:3px solid var(--good)}
.objs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
@media (max-width:760px){.objs{grid-template-columns:1fr}}
.objs div{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:.92rem}
.caso{display:grid; grid-template-columns:auto 1fr; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.caso .rol{width:48px; height:48px; border-radius:50%; background:var(--cyan-soft); border:1px solid var(--cyan); display:grid; place-items:center; font-family:var(--f-display); font-weight:600; color:var(--ink)}
.caso dl{margin:0; display:grid; grid-template-columns:max-content 1fr; gap:6px 12px; font-size:.95rem}
.caso dt{font-family:var(--f-mono); font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding-top:3px}
.caso dd{margin:0}
@media (max-width:560px){.caso{grid-template-columns:1fr} .caso dl{grid-template-columns:1fr}}

/* ---------- Guía docente ---------- */
.docente{display:none; border:1px dashed var(--warn); background:var(--warn-soft); border-radius:var(--r); padding:14px 16px; flex-direction:column; gap:10px}
body.instructor .docente{display:flex}
.docente .k{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--warn)}
.docente table{border-collapse:collapse; width:100%; font-size:.9rem}
.docente td,.docente th{border-bottom:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top}

/* hoja de cálculo simulada */
.sheetwrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
table.sheet{border-collapse:collapse; font-size:.86rem; font-variant-numeric:tabular-nums; min-width:100%}
table.sheet th,table.sheet td{border:1px solid var(--grid); padding:5px 9px; white-space:nowrap; overflow-wrap:normal}
table.sheet thead th{background:var(--surface-2); color:var(--muted); font-family:var(--f-mono); font-weight:400; font-size:.75rem; text-align:center}
table.sheet td.rn{background:var(--surface-2); color:var(--muted); font-family:var(--f-mono); font-size:.75rem; text-align:center; width:34px}
table.sheet td.num{text-align:right}
table.sheet td.hd{background:var(--cyan-soft); font-weight:600; text-align:center}
table.sheet td.tt{background:var(--brand); color:var(--on-brand); font-weight:600; text-align:center}
table.sheet td.bold{font-weight:700}
table.sheet td.note{font-style:italic; color:var(--bad)}
table.sheet td[data-p]{cursor:pointer}
table.sheet td[data-p]:hover{outline:2px solid var(--cyan); outline-offset:-2px}
table.sheet td.found{box-shadow:inset 0 0 0 2px var(--bad); background:var(--bad-soft); color:var(--ink)}
table.sheet tr.hit td{background:var(--sel)}
table.sheet tr.miss td{background:var(--bad-soft)}
.plist{display:flex; flex-direction:column; gap:8px; padding:0; margin:0}
.plist li{list-style:none; border:1px solid var(--line); border-radius:8px; padding:9px 12px; background:var(--surface); font-size:.93rem}
.plist li.locked{color:var(--muted); background:var(--surface-2)}
.plist li b{font-family:var(--f-display); font-weight:600}
.ctl{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end}
.ctl label{display:flex; flex-direction:column; gap:4px; font-size:.78rem; color:var(--muted); font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.05em}
select,input[type=search]{font:inherit; font-size:.92rem; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); text-transform:none; letter-spacing:0; max-width:100%}
.chk{flex-direction:row!important; align-items:center; gap:8px!important; text-transform:none!important; font-family:var(--f-body)!important; font-size:.92rem!important; color:var(--ink)!important; letter-spacing:0!important}
.sp{color:var(--bad); font-weight:700}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{font:inherit; font-size:.85rem; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:99px; padding:6px 12px; cursor:pointer; text-align:left; text-decoration:none}
.chip:hover{border-color:var(--brand-ink)}
.chip[aria-pressed="true"]{background:var(--cyan-soft); border-color:var(--cyan)}
.insight{font-size:.95rem; padding:10px 14px; border-radius:8px; background:var(--surface-2)}
.chartbox{position:relative}
.chartbox svg text{fill:var(--ink); font-family:var(--f-body)}
.chartbox svg .axis{fill:var(--muted); font-size:11px}
.tip-pop{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:.8rem; padding:6px 9px; border-radius:6px; white-space:nowrap; transform:translate(-50%,-110%)}

pre.code{font-family:var(--f-mono); font-size:.84rem; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; margin:0; white-space:pre}
.steps{counter-reset:s; display:flex; flex-direction:column; gap:10px; padding:0; margin:0}
.steps > li{list-style:none; display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start}
.steps > li::before{counter-increment:s; content:counter(s); font-family:var(--f-mono); font-size:.8rem; width:26px; height:26px; display:grid; place-items:center; border-radius:6px; background:var(--brand); color:var(--on-brand)}
.steps > li > div{min-width:0; display:flex; flex-direction:column; gap:6px}
.steps > li.parte{display:block}
.steps > li.parte::before{content:none; counter-increment:none}
.steps > li.parte h3{margin:10px 0 2px}
.checkpoint{font-size:.9rem; border-radius:8px; padding:7px 10px; background:var(--good-soft); border:1px solid var(--good)}
.checkpoint b{color:var(--good)}
.colab{display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.colab > *{min-width:0}
@media (max-width:640px){.colab{grid-template-columns:1fr}}
.prompt{border:1px solid var(--line); border-radius:var(--r); background:var(--surface); overflow:hidden}
.prompt header{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 12px; background:var(--surface-2); border-bottom:1px solid var(--line); font-size:.88rem}
.prompt pre{margin:0; padding:12px 14px; white-space:pre-wrap; font-family:var(--f-mono); font-size:.82rem}
.quiz{display:flex; flex-direction:column; gap:14px}
.qitem{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:flex; flex-direction:column; gap:10px}
.opts{display:flex; flex-direction:column; gap:6px}
.opt{font:inherit; font-size:.95rem; text-align:left; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:8px 12px; border-radius:8px; cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--brand-ink)}
.opt.right{border-color:var(--good); background:var(--good-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.why{font-size:.92rem; padding:8px 12px; border-radius:8px; background:var(--surface-2)}
.datatbl{border-collapse:collapse; width:100%; font-size:.9rem}
.datatbl th,.datatbl td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top}
.datatbl th{font-family:var(--f-mono); font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:400}
.datatbl td.num{text-align:right; font-variant-numeric:tabular-nums; overflow-wrap:normal; white-space:nowrap}
.scroll{overflow-x:auto}

/* ---------- La empresa ---------- */
.flow{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (max-width:900px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.flow{grid-template-columns:1fr}}
.dept{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:6px}
.dept b{font-family:var(--f-display); font-weight:600}
.dept .arrow{font-family:var(--f-mono); font-size:.8rem; color:var(--brand-ink)}
.dept p{font-size:.88rem; color:var(--muted)}
.invoice{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; font-size:.9rem; display:flex; flex-direction:column; gap:8px}
.invoice .ih{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:2px solid var(--brand-ink); padding-bottom:8px}
.invoice table{width:100%; border-collapse:collapse}
.invoice td,.invoice th{padding:4px 6px; border-bottom:1px solid var(--grid); text-align:left}
.invoice td.num,.invoice th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- Gráficos ---------- */
.gcards{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
@media (max-width:820px){.gcards{grid-template-columns:1fr}}
.gcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; display:flex; flex-direction:column; gap:10px; min-width:0}
.gcard .gh{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap}
.gcard dl{margin:0; display:grid; grid-template-columns:max-content 1fr; gap:6px 12px; font-size:.9rem}
.gcard dt{font-family:var(--f-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding-top:3px}
.gcard dd{margin:0; min-width:0}
@media (max-width:520px){.gcard dl{grid-template-columns:1fr}}
.gtitle{font-family:var(--f-display); font-weight:600; font-size:.92rem}
.mini svg{display:block; width:100%; height:auto}
.mini svg text{fill:var(--ink); font-family:var(--f-body)}
.mini svg .axis{fill:var(--muted)}

/* ---------- Laboratorio ---------- */
.taller-meta{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (max-width:760px){.taller-meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.taller-meta div{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:.9rem; min-width:0; overflow-wrap:anywhere}
.taller-meta span{display:block; font-family:var(--f-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
.tcard{display:flex; flex-direction:column; gap:8px; padding:16px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); text-decoration:none; color:inherit}
.tcard:hover{border-color:var(--brand-ink); box-shadow:var(--shadow)}
.tcard .tn{font-family:var(--f-mono); font-size:.75rem; color:var(--muted)}
.tcard p{font-size:.92rem; color:var(--muted)}
.checklist{display:flex; flex-direction:column; gap:6px}
.checklist label{display:flex; gap:10px; align-items:flex-start; font-size:.95rem; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 12px; cursor:pointer}
.checklist input{margin-top:4px}
.checklist label.done{background:var(--good-soft); border-color:var(--good)}

footer{border-top:1px solid var(--line); padding-block:22px; font-size:.86rem; color:var(--muted); background:var(--surface)}
footer .wrap{display:flex; gap:18px; flex-wrap:wrap; justify-content:space-between}
.toast{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:8px 14px; border-radius:8px; font-size:.88rem; z-index:40}

/* anatomía de Colab (curso rápido) */
.cp-svg{width:100%; height:auto; display:block}
.cp-zone{fill:transparent; stroke:var(--s3); stroke-width:1.5; stroke-dasharray:5 4; opacity:.55; transition:opacity .15s, stroke-width .15s}
.cp-num circle{fill:var(--s3)}
.cp-line{fill:none; stroke:var(--s3); stroke-width:1.2; stroke-dasharray:3 3; opacity:.5; transition:opacity .15s}
.cp-dot{fill:var(--s3); opacity:.7}
.cp-hit{fill:transparent; transition:fill .15s}
.cp-item{cursor:pointer; outline:none}
.cp-focus .cp-zone, .cp-focus .cp-line, .cp-focus .cp-dot, .cp-focus .cp-num, .cp-focus .cp-item{opacity:.18}
.cp-focus .on{opacity:1 !important}
.cp-focus .cp-zone.on{stroke-width:3; stroke-dasharray:none; fill:color-mix(in srgb, var(--s3) 8%, transparent)}
.cp-focus .cp-line.on{stroke-width:2; stroke-dasharray:none}
.cp-item.on .cp-hit{fill:var(--surface-2)}
.cp-item:focus-visible .cp-hit{stroke:var(--s1); stroke-width:2}
.callout p, .steps span, .checkpoint{overflow-wrap:anywhere}
.ctl label{max-width:100%; min-width:0} .ctl select{max-width:100%}
